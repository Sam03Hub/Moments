<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moments</title>

  <!-- Typography: Inter for UI & Playfair Display for Editorial Titles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* CSS System Variables */
    :root {
      --bg-primary: #ffffff;
      --bg-sidebar: #fbfbfb;
      --bg-surface: #f4f4f5;
      --bg-display: #fbfbfb;
      --backdrop-filter: blur(48px) brightness(0.95) saturate(1.1);
      --backdrop-opacity: 0.35;
      --text-main: #18181b;
      --text-muted: #71717a;
      --text-light: #a1a1aa;
      --border-color: #e4e4e7;
      --accent: #2563eb;
      --sidebar-width: 440px;
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-title: 'Playfair Display', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg-primary: #09090b;
      --bg-sidebar: #121215;
      --bg-surface: #1f1f23;
      --bg-display: #000000;
      --backdrop-filter: blur(48px) brightness(0.35) saturate(1.2);
      --backdrop-opacity: 0.75;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-light: #52525b;
      --border-color: #27272a;
      --accent: #3b82f6;
    }

    /* Core Resets */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Mobile-first base: Allow clean native scrolling */
    html {
      width: 100%;
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* Mobile Layout: Stacked vertically with fluid dimensions */
    .app-viewport {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100dvh;
      position: relative;
    }

    /* Photo Container: Dynamic responsive height on mobile */
    .photo-display {
      width: 100%;
      height: 54vh;
      height: 54dvh;
      min-height: 280px;
      position: relative;
      background-color: var(--bg-display);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background-color 0.3s ease;
      flex-shrink: 0;
    }

    /* Hardware-Accelerated Two-Layer Crossfading Backdrops */
    .photo-backdrop {
      position: absolute;
      top: -24px;
      left: -24px;
      right: -24px;
      bottom: -24px;
      background-size: cover;
      background-position: center;
      filter: var(--backdrop-filter);
      transform: scale(1.1) translateZ(0);
      will-change: opacity, transform;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.28s ease-in-out, filter 0.3s ease;
    }

    .photo-backdrop.active {
      opacity: var(--backdrop-opacity);
    }

    .main-image {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 1;
      transition: opacity 0.25s ease-in-out;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.25));
    }

    /* Navigation Overlay Arrows: Touch-friendly base */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.9;
      transition: var(--transition-smooth);
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(0.95);
      background: rgba(0, 0, 0, 0.65);
    }

    .nav-prev { left: 14px; }
    .nav-next { right: 14px; }

    /* Editorial Sidebar */
    .sidebar {
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      position: relative;
      z-index: 20;
      flex: 1 1 auto;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .sidebar-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .counter-indicator {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 400;
      font-style: normal;
      color: var(--text-muted);
      letter-spacing: normal;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      min-height: 38px;
      padding: 6px;
      border-radius: 6px;
      transition: var(--transition-smooth);
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-surface);
    }

    /* Content Area */
    .sidebar-content {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .meta-date {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 400;
      font-style: normal;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text-muted);
    }

    .meta-title {
      font-family: var(--font-title);
      font-size: 1.85rem;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text-main);
      letter-spacing: -0.01em;
      word-wrap: break-word;
    }

    .meta-author-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .meta-author {
      font-weight: 500;
      color: var(--text-main);
    }

    .meta-divider {
      width: 32px;
      height: 1px;
      background-color: var(--border-color);
      margin: 2px 0;
    }

    .meta-description {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Footer Container */
    .sidebar-footer-fixed {
      padding: 18px 20px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .fixed-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fixed-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--text-light);
      min-width: 65px;
    }

    .location-text {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-word;
    }

    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    .tag {
      font-size: 0.72rem;
      padding: 4px 10px;
      background-color: var(--bg-surface);
      color: var(--text-muted);
      border-radius: 4px;
      font-weight: 400;
      white-space: nowrap;
      transition: var(--transition-smooth);
    }

    .tag:hover {
      color: var(--text-main);
    }

    /* ==========================================================================
       Desktop Breakpoint (Screens >= 992px)
       Restores strict side-by-side split screen with independent internal scroll
       ========================================================================== */
    @media (min-width: 992px) {
      html, body {
        height: 100vh;
        overflow: hidden;
      }

      .app-viewport {
        flex-direction: row;
        height: 100vh;
      }

      .photo-display {
        flex: 1;
        height: 100vh;
        min-height: unset;
      }

      .nav-arrow {
        opacity: 0;
        width: 52px;
        height: 52px;
      }

      .photo-display:hover .nav-arrow {
        opacity: 0.85;
      }

      .nav-arrow:hover {
        opacity: 1 !important;
        transform: translateY(-50%) scale(1.06);
      }

      .nav-prev { left: 28px; }
      .nav-next { right: 28px; }

      .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        max-width: var(--sidebar-width);
        height: 100vh;
        border-top: none;
        border-left: 1px solid var(--border-color);
        flex: none;
      }

      .sidebar-header {
        padding: 28px 32px;
      }

      .header-actions {
        gap: 16px;
      }

      .sidebar-content {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 40px 32px 32px;
        gap: 24px;
      }

      .meta-title {
        font-size: 2.35rem;
        line-height: 1.22;
      }

      .meta-description {
        font-size: 0.95rem;
        line-height: 1.7;
      }

      .sidebar-footer-fixed {
        padding: 24px 32px 28px;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- Photo Viewport -->
    <main class="photo-display" id="photoDisplay">
      <!-- Dual Layered Blurred Backdrops -->
      <div class="photo-backdrop active" id="bgLayerA"></div>
      <div class="photo-backdrop" id="bgLayerB"></div>

      <!-- Main Photo -->
      <img src="" alt="" class="main-image" id="mainPhoto" />

      <!-- Navigation Overlay Arrows -->
      <button class="nav-arrow nav-prev" id="btnPrev" aria-label="Previous Photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <button class="nav-arrow nav-next" id="btnNext" aria-label="Next Photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </main>

    <!-- Editorial Sidebar -->
    <aside class="sidebar">
      <!-- Header Bar -->
      <div class="sidebar-header">
        <div class="brand-title">Moments</div>
        
        <div class="header-actions">
          <div class="counter-indicator" id="photoCounter">01 / 04</div>

          <!-- Fullscreen Toggle Button -->
          <button class="action-btn" id="btnFullscreen" title="Fullscreen" aria-label="Toggle Fullscreen">
            <svg id="iconEnterFS" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <svg id="iconExitFS" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
            </svg>
          </button>

          <!-- Dark Mode Toggle Button -->
          <button class="action-btn" id="btnTheme" title="Dark" aria-label="Toggle Theme">
            <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Main Meta Content -->
      <div class="sidebar-content">
        <span class="meta-date" id="photoDate">October 14, 2026</span>
        <h1 class="meta-title" id="photoTitle">Misty Alpine Pass</h1>

        <!-- [TEMPORARILY DISABLED: Captured by]
        <div class="meta-author-wrap">
          <span>Captured by</span>
          <span class="meta-author" id="photoAuthor">Elena Rostova</span>
        </div>
        -->

        <div class="meta-divider"></div>

        <p class="meta-description" id="photoDesc">
          Morning light breaking through dense cloud cover in the high-altitude pass. The harsh rock formations offer a striking visual contrast to the soft, flowing mist enveloping the valley below.
        </p>
      </div>

      <!-- Fixed Container: Location & Tags -->
      <div class="sidebar-footer-fixed">
        <div class="fixed-row">
          <span class="fixed-label">Location</span>
          <div class="location-text" id="photoLocation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-light)">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span>Dolomites, Italy</span>
          </div>
        </div>

        <!-- [TEMPORARILY DISABLED: Tags Section]
        <div class="fixed-row">
          <span class="fixed-label">Tags</span>
          <div class="tags-list" id="tagContainer">
            <span class="tag">Landscape</span>
            <span class="tag">Mountains</span>
            <span class="tag">Moody</span>
          </div>
        </div>
        -->
      </div>
    </aside>
  </div>

  <script>
    /* Local Image Dataset */
    const PHOTOS = [
      {
        id: 1,
        title: "Misty Alpine Pass",
        date: "October 14, 2026",
        author: "Elena Rostova",
        location: "Bindusagar Lake, Bhubaneswar",
        description: "Morning light breaking through dense cloud cover in the high-altitude pass. The harsh rock formations offer a striking visual contrast to the soft, flowing mist enveloping the valley below.",
        tags: ["Landscape", "Mountains", "Moody", "Dolomites"],
        src: "photos/1.jpg"
      },
      {
        id: 2,
        title: "Urban Geometry",
        date: "August 28, 2026",
        author: "Kenji Sato",
        location: "Damana Durga Puja, Bhubaneswar",
        description: "High-contrast architectural lines and reflections captured during golden hour in the central business district. Glass, steel, and symmetry converge to create clean visual harmony.",
        tags: ["Architecture", "Urban", "Minimal", "Monochrome"],
        src: "photos/2.jpg"
      },
      {
        id: 3,
        title: "Solitude in Dune 45",
        date: "July 19, 2026",
        author: "Marcus Vance",
        location: "Sossusvlei, Namibia",
        description: "The sharp edge separating deep shadow from the burnt-orange morning sun on one of the highest sand dunes in the Namib desert.",
        tags: ["Desert", "Minimalist", "Warmth", "Shadow"],
        src: "photos/3.jpg"
      },
      {
        id: 4,
        title: "Solitude in Dune 45",
        date: "July 19, 2026",
        author: "Marcus Vance",
        location: "Sossusvlei, Namibia",
        description: "The sharp edge separating deep shadow from the burnt-orange morning sun on one of the highest sand dunes in the Namib desert.",
        tags: ["Desert", "Minimalist", "Warmth", "Shadow"],
        src: "photos/4.jpg"
      }
    ];

    // Preload all local photos into browser cache
    PHOTOS.forEach(p => {
      const preloadImg = new Image();
      preloadImg.src = p.src;
    });

    // State
    let currentIndex = 0;
    let activeBgIsA = true;

    // DOM Elements Cache
    const dom = {
      mainPhoto: document.getElementById('mainPhoto'),
      bgLayerA: document.getElementById('bgLayerA'),
      bgLayerB: document.getElementById('bgLayerB'),
      photoCounter: document.getElementById('photoCounter'),
      photoTitle: document.getElementById('photoTitle'),
      photoDate: document.getElementById('photoDate'),
      photoAuthor: document.getElementById('photoAuthor'),
      photoDesc: document.getElementById('photoDesc'),
      photoLocationText: document.getElementById('photoLocation')?.querySelector('span'),
      tagContainer: document.getElementById('tagContainer'),
      btnPrev: document.getElementById('btnPrev'),
      btnNext: document.getElementById('btnNext'),
      btnFullscreen: document.getElementById('btnFullscreen'),
      btnTheme: document.getElementById('btnTheme'),
      iconEnterFS: document.getElementById('iconEnterFS'),
      iconExitFS: document.getElementById('iconExitFS'),
      iconMoon: document.getElementById('iconMoon'),
      iconSun: document.getElementById('iconSun'),
      photoDisplay: document.getElementById('photoDisplay')
    };

    /* Render Function with Zero-Lag Crossfade & Null-Safe Checks */
    function renderPhoto(index) {
      currentIndex = index;
      const data = PHOTOS[index];

      // Update text details directly
      dom.photoCounter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(PHOTOS.length).padStart(2, '0')}`;
      dom.photoTitle.textContent = data.title;
      dom.photoDate.textContent = data.date;
      dom.photoDesc.textContent = data.description;
      
      if (dom.photoLocationText) {
        dom.photoLocationText.textContent = data.location;
      }

      if (dom.photoAuthor) {
        dom.photoAuthor.textContent = data.author || '';
      }

      if (dom.tagContainer) {
        dom.tagContainer.innerHTML = '';
        if (Array.isArray(data.tags)) {
          const fragment = document.createDocumentFragment();
          data.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            fragment.appendChild(span);
          });
          dom.tagContainer.appendChild(fragment);
        }
      }

      // Dual-layer crossfade
      const currentLayer = activeBgIsA ? dom.bgLayerA : dom.bgLayerB;
      const nextLayer = activeBgIsA ? dom.bgLayerB : dom.bgLayerA;

      nextLayer.style.backgroundImage = `url('${data.src}')`;
      nextLayer.classList.add('active');
      currentLayer.classList.remove('active');
      activeBgIsA = !activeBgIsA;

      // Foreground main image
      dom.mainPhoto.style.opacity = '1';
      dom.mainPhoto.alt = data.title;
      dom.mainPhoto.src = data.src;

      dom.mainPhoto.onerror = function() {
        console.error("Browser failed to load:", data.src);
      };
    }

    // Navigation Controls
    function nextPhoto() {
      const nextIdx = (currentIndex + 1) % PHOTOS.length;
      renderPhoto(nextIdx);
    }

    function prevPhoto() {
      const prevIdx = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length;
      renderPhoto(prevIdx);
    }

    dom.btnNext.addEventListener('click', nextPhoto);
    dom.btnPrev.addEventListener('click', prevPhoto);

    // Keyboard Shortcuts (Arrow Keys & Space)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextPhoto();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevPhoto();
      }
    });

    // Mobile Swipe Gestures on Photo Container
    let touchStartX = 0;
    let touchEndX = 0;

    dom.photoDisplay.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    dom.photoDisplay.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const threshold = 40;
      if (touchEndX < touchStartX - threshold) {
        nextPhoto();
      } else if (touchEndX > touchStartX + threshold) {
        prevPhoto();
      }
    }

    // Fullscreen Toggle
    dom.btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFS = !!document.fullscreenElement;
      dom.iconEnterFS.style.display = isFS ? 'none' : 'block';
      dom.iconExitFS.style.display = isFS ? 'block' : 'none';
    });

    // Dark/Light Theme Toggle
    dom.btnTheme.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.body.removeAttribute('data-theme');
        dom.iconMoon.style.display = 'block';
        dom.iconSun.style.display = 'none';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        dom.iconMoon.style.display = 'none';
        dom.iconSun.style.display = 'block';
      }
    });

    // Initialize initial state immediately
    dom.bgLayerA.style.backgroundImage = `url('${PHOTOS[0].src}')`;
    renderPhoto(0);
  </script>
</body>
</html>
